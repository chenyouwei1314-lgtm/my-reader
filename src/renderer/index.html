<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirWei Reader</title>
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-left">
        <span id="library-path-text" class="topbar-title">No library selected</span>
      </div>
      <div class="topbar-right">
        <div class="toolbar-search-wrap">
          <input id="book-search-input" class="toolbar-search-input" type="text" placeholder="Search" autocomplete="off">

          <button id="book-search-clear-btn" class="toolbar-search-icon-btn" type="button" title="Search" aria-label="Search">
            <svg class="toolbar-search-svg" viewBox="0 -960 960 960" aria-hidden="true">
              <path id="book-search-icon-path" fill="currentColor"
                d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z">
              </path>
            </svg>
          </button>
        </div>
        <button id="fullscreen-btn" class="icon-button" aria-label="Enter fullscreen" title="Enter fullscreen">
          <svg class="topbar-svg icon-fullscreen" viewBox="0 -960 960 960" aria-hidden="true">
            <path id="fullscreen-icon-path"
              d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z"
              fill="currentColor">
            </path>
          </svg>
        </button>

        <button id="settings-btn" class="icon-button" aria-label="Settings" title="Settings">
          <svg class="topbar-svg icon-settings" viewBox="0 -960 960 960" aria-hidden="true">
            <path
              d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm112-260q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Z"
              fill="currentColor">
            </path>
          </svg>
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="library-section">
        <div id="book-grid" class="book-grid"></div>
      </section>

      <aside class="detail-panel" id="detail-panel">
        <div class="detail-empty">Select a book first</div>
      </aside>
    </main>
  </div>
</body>

</html>
